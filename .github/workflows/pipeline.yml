deploy-staging:
  runs-on: ubuntu-latest
  needs: [build, security-analysis]
  if: github.ref != 'refs/heads/main'
  steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Login Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build e Push Docker Staging
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/api-lacrei-saude:staging-latest \
                     -t ${{ secrets.DOCKER_USERNAME }}/api-lacrei-saude:staging-${{ github.sha }} .
        docker push ${{ secrets.DOCKER_USERNAME }}/api-lacrei-saude:staging-${{ github.sha }}
        docker push ${{ secrets.DOCKER_USERNAME }}/api-lacrei-saude:staging-latest

    - name: Deploy Staging via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        script: |
          # Para o container antigo se existir
          if docker ps -a --format '{{.Names}}' | grep -Eq '^api-lacrei-saude-staging$'; then
            docker stop api-lacrei-saude-staging
            docker rm api-lacrei-saude-staging
          fi
          
          # Inicia novo container
          docker run -d --name api-lacrei-saude-staging -p 8081:3000 \
            --restart always ${{ secrets.DOCKER_USERNAME }}/api-lacrei-saude:staging-${{ github.sha }}
          
          # Healthcheck simples
          sleep 10
          STATUS=$(curl -s http://localhost:8081/status | grep OK || echo "FAIL")
          if [ "$STATUS" != "OK" ]; then
            echo "Healthcheck falhou! Rollback container anterior..."
            docker stop api-lacrei-saude-staging || true
            docker rm api-lacrei-saude-staging || true
            docker run -d --name api-lacrei-saude-staging -p 8081:3000 \
              --restart always ${{ secrets.DOCKER_USERNAME }}/api-lacrei-saude:staging-latest
            exit 1
          fi
